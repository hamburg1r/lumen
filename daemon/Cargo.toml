[package]
name = "lumen"
version = "0.1.0"
edition = "2021"
description = "Lumen session daemon"
license = "MIT"

[dependencies]
zbus = { version = "5", features = ["blocking"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
